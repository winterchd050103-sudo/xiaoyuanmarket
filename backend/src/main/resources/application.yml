server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: xiaoyuan-market
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xiaoyuan_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      connection-timeout: 10000
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123456
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 1
        max-concurrency: 4
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

jwt:
  # HS256 密钥，生产环境请更换
  secret: xiaoyuan-market-jwt-secret-key-please-change-in-production-0123456789
  expire-hours: 72

market:
  upload-dir: D:/PythonProject/xiaoyuanmarket/backend/upload
  # 订单超时时间（分钟），演示环境设为 2 分钟便于观察，生产建议 15
  order-timeout-minutes: 2
  # 模拟支付回调验签盐值
  pay-salt: xiaoyuan-pay-salt-2026

logging:
  level:
    com.xiaoyuan.market: info
